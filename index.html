<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISIONMATE AI</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>

<body>

<header>
<h2>VISIONMATE AI</h2>
<p id="status">Loading AI model...</p>
</header>

<main>

<section class="panel">

<h3>Select Camera</h3>

<button id="phoneBtn">📱 Phone Camera</button>
<button id="espBtn">📷 ESP32 Camera</button>

<div id="espControls">
<h4>ESP32-CAM URL</h4>
<input id="espUrl" type="url"
placeholder="http://192.168.1.100:81/stream">

<button id="connectEsp">Connect ESP32</button>
</div>

</section>

<section class="panel">

<h3>Live Camera</h3>

<div id="cameraBox">
<video id="video" autoplay muted playsinline></video>
<img id="espImage" alt="ESP32 stream">
<canvas id="overlay"></canvas>
</div>

<button id="stopBtn">Stop Camera</button>
<button id="detectBtn">Start Detection</button>

</section>

<section class="panel">

<h3>Detection Results</h3>
<div id="results">Waiting for camera...</div>

</section>

<section class="panel">

<h3>Product Scanner</h3>
<button id="productBtn">Capture Product</button>
</section>

<section class="panel">

<h3>Currency Scanner</h3>
<button id="currencyBtn">Capture Currency</button>

</section>

</main>

<script src="js/app.js"></script>

</body>
</html>
